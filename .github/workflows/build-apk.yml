name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Offline Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 📦 Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: 🛠️ Prebuild Native Android Project
        run: |
          cd mobile
          npx expo prebuild --platform android --clean

      - name: 🧩 Integrate Native Widget Files & Manifest
        run: |
          mkdir -p mobile/android/app/src/main/java/com/tracker/widget
          mkdir -p mobile/android/app/src/main/res/layout
          mkdir -p mobile/android/app/src/main/res/xml

          cp -f mobile/widget_src/java/com/tracker/widget/GoalsWidgetProvider.kt mobile/android/app/src/main/java/com/tracker/widget/GoalsWidgetProvider.kt
          cp -f mobile/widget_src/res/layout/widget_goals_medium.xml mobile/android/app/src/main/res/layout/widget_goals_medium.xml
          cp -f mobile/widget_src/res/layout/widget_goals_small.xml mobile/android/app/src/main/res/layout/widget_goals_small.xml
          cp -f mobile/widget_src/res/xml/goals_widget_info.xml mobile/android/app/src/main/res/xml/goals_widget_info.xml

          MANIFEST="mobile/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "GoalsWidgetProvider" "$MANIFEST"; then
            WIDGET_CONFIG='    <receiver android:name="com.tracker.widget.GoalsWidgetProvider" android:exported="true">\n      <intent-filter>\n        <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n      </intent-filter>\n      <meta-data android:name="android.appwidget.provider" android:resource="@xml/goals_widget_info" />\n    </receiver>\n  </application>'
            sed -i "s|  </application>|$WIDGET_CONFIG|" "$MANIFEST"
          fi

      - name: ⚡ Configure Standalone Offline Signing
        run: |
          BUILD_GRADLE="mobile/android/app/build.gradle"
          # Configure release buildType to sign with debug keystore so it installs immediately on any phone
          python3 -c "
          with open('$BUILD_GRADLE', 'r') as f:
              content = f.read()

          # Replace signingConfig signingConfigs.release or add signingConfig signingConfigs.debug to release
          if 'signingConfigs.debug' in content and 'signingConfig signingConfigs.debug' not in content:
              content = content.replace('signingConfig signingConfigs.release', 'signingConfig signingConfigs.debug')
          
          # In Expo / React Native, ensure release block has signingConfig signingConfigs.debug
          if 'release {' in content and 'signingConfig signingConfigs.debug' not in content:
              content = content.replace('release {', 'release {\n            signingConfig signingConfigs.debug')

          with open('$BUILD_GRADLE', 'w') as f:
              f.write(content)
          "
          grep -A 10 "buildTypes" "$BUILD_GRADLE" || true

      - name: 🔨 Compile 100% Offline Standalone Android APK with Gradle
        run: |
          cd mobile/android
          chmod +x gradlew
          # assembleRelease packages the full offline JS bundle + Hermes bytecode into the APK
          ./gradlew assembleRelease --no-daemon

      - name: 🔍 Locate Generated Standalone APK
        id: locate_apk
        run: |
          APK_PATH=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found Standalone APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 📤 Upload Standalone APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: TrackOrbit-Offline-APK
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 30

      - name: 🚀 Publish Direct Standalone APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: ${{ steps.locate_apk.outputs.apk_path }}
          tag_name: v1.0.${{ github.run_number }}-offline
          name: TrackOrbit v1.0.${{ github.run_number }} (100% Offline Standalone APK)
          body: |
            ### 📱 TrackOrbit 100% Offline Standalone Android APK
            This APK packages the entire JavaScript bundle and Hermes runtime directly inside the file:
            - **100% Offline:** Runs completely standalone without any Metro server, computer, or Wi-Fi.
            - **Offline Local SQLite Storage:** Automatically persists all weekly goals and daily progress locally on device.
            - **Native Widgets:** Includes the Android Home Screen Widget.
            
            #### Instructions:
            1. Download `app-release.apk` directly on your Android phone.
            2. Tap to install (enable "Install from unknown sources" if prompted).
            3. Open and track your goals anytime, anywhere, with zero internet needed!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
