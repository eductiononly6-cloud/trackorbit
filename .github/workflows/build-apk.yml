name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 📦 Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: 🛠️ Prebuild Native Android Project
        run: |
          cd mobile
          npx expo prebuild --platform android --clean

      - name: 🧩 Integrate Native Widget Files & Manifest
        run: |
          # Ensure destination directories exist
          mkdir -p mobile/android/app/src/main/java/com/tracker/widget
          mkdir -p mobile/android/app/src/main/res/layout
          mkdir -p mobile/android/app/src/main/res/xml

          # Copy from persistent template directory
          cp -f mobile/widget_src/java/com/tracker/widget/GoalsWidgetProvider.kt mobile/android/app/src/main/java/com/tracker/widget/GoalsWidgetProvider.kt
          cp -f mobile/widget_src/res/layout/widget_goals_medium.xml mobile/android/app/src/main/res/layout/widget_goals_medium.xml
          cp -f mobile/widget_src/res/layout/widget_goals_small.xml mobile/android/app/src/main/res/layout/widget_goals_small.xml
          cp -f mobile/widget_src/res/xml/goals_widget_info.xml mobile/android/app/src/main/res/xml/goals_widget_info.xml

          # Verify files exist before compiling
          ls -la mobile/android/app/src/main/res/xml/
          ls -la mobile/android/app/src/main/res/layout/

          # Inject widget receiver into AndroidManifest.xml before </application> if not already present
          MANIFEST="mobile/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "GoalsWidgetProvider" "$MANIFEST"; then
            WIDGET_CONFIG='    <receiver android:name="com.tracker.widget.GoalsWidgetProvider" android:exported="true">\n      <intent-filter>\n        <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n      </intent-filter>\n      <meta-data android:name="android.appwidget.provider" android:resource="@xml/goals_widget_info" />\n    </receiver>\n  </application>'
            sed -i "s|  </application>|$WIDGET_CONFIG|" "$MANIFEST"
          fi

      - name: 🔨 Compile Android Debug APK with Gradle
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 🔍 Locate Generated APK
        id: locate_apk
        run: |
          APK_PATH=$(find mobile/android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 📤 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: TrackOrbit-Debug-App
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 30

      - name: 🚀 Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: ${{ steps.locate_apk.outputs.apk_path }}
          tag_name: v1.0.${{ github.run_number }}
          name: TrackOrbit v1.0.${{ github.run_number }} (Direct APK)
          body: |
            ### 📱 TrackOrbit Android APK
            Install directly on your phone:
            1. Download the `.apk` file below directly on your Android phone.
            2. Tap to install (enable "Install from unknown sources" if prompted).
            3. Enjoy full offline goal tracking with live calendar splitting!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
